# ESPHome-Konfiguration für ESP32-CAM (AI-Thinker) vor dem Heizungsmanometer
#
# Mit Home Assistant: Die Integration „Manometer-Leser“ holt die Bilder über die Kamera-Entität und schaltet
# die Blitz-LED („Beleuchtung“) nur während der Messung ein.
# Einzelbild-Server (Port 8081) und Statusseite (Port 80) braucht nur der eigenständige Server ohne Home Assistant.
#
# Anleitung: docs/01-esp32-cam.md

esphome:
  name: manometer-cam
  friendly_name: Manometer Cam

esp32:
  board: esp32cam
  framework:
    type: esp-idf

# Die AI-Thinker ESP32-CAM hat 4 MB PSRAM – die Kamera braucht ihn als Bildspeicher
psram:
  mode: quad
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none       # stabilere Verbindung für Bildübertragung
  ap:
    ssid: "Manometer-Cam Fallback"

captive_portal:

# --- Kamera (AI-Thinker-Pinbelegung) ---
esp32_camera:
  name: Manometer
  external_clock:
    pin: GPIO0
    frequency: 20MHz          # bei "Got invalid frame" testweise 10MHz
  i2c_pins:                   # erzeugt eine "deprecated"-Warnung, läuft aber stabil (die i2c_id-Variante lieferte keine Bilder)
    sda: GPIO26
    scl: GPIO27
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  resolution: 800x600
  jpeg_quality: 10
  max_framerate: 1 fps        # wir brauchen nur Einzelbilder
  idle_framerate: 0.05 fps
  # Belichtung fest einstellen, wenn die Werte bei wechselndem Raumlicht springen:
  # aec_mode: MANUAL
  # aec_value: 300

# Einzelbild: http://<IP>:8081/ – praktisch zum Ausrichten im Browser, nötig für den eigenständigen Server
esp32_camera_web_server:
  - port: 8081
    mode: snapshot

# Statusseite: http://<IP>/ – der eigenständige Server schaltet darüber die LED
web_server:
  port: 80

# --- Beleuchtung: Blitz-LED an GPIO4, wird nur zur Messung eingeschaltet (Name „Beleuchtung“ beibehalten) ---
output:
  - platform: ledc
    id: led_pwm
    pin: GPIO4
    channel: 2                # Kanal 0 belegt die Kamera-Clock

light:
  - platform: monochromatic
    id: led
    name: Beleuchtung
    output: led_pwm
    restore_mode: ALWAYS_OFF   # nach Neustart aus; wird nur zur Messung eingeschaltet
    default_transition_length: 0s

sensor:
  - platform: wifi_signal
    name: WLAN Signal
    update_interval: 120s
  - platform: uptime
    name: Uptime
